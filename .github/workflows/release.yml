name: release

# Publishes @jb9k62/good2go when a version tag is pushed. Publishing uses npm trusted
# publishing (OIDC): there is no NPM_TOKEN secret, and the npm registry issues a provenance
# attestation for each release. The `verify` job builds, tests and smoke-tests one tarball;
# `publish` publishes exactly that file. See docs/RELEASING.md.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Tag and package.json agree
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME;
            const version = JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version;
            if (tag !== "v" + version) {
              console.error("Version mismatch: tag is " + tag + ", package.json is " + version);
              process.exit(1);
            }
            console.log("Tag " + tag + " matches package.json " + version);
          '

      # Dependency install scripts (puppeteer, through mermaid-cli) are not needed to build,
      # test or pack, so none of them run in a job that produces a release.
      - run: npm ci --ignore-scripts
      - run: npm run check

      - name: Pack and smoke-test the tarball
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/pack"
          mkdir -p "$PACK_DIR"
          TARBALL="$PACK_DIR/$(npm pack --silent --pack-destination "$PACK_DIR")"
          SMOKE="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts "$TARBALL"
          npx --no-install good2go --version
          npx --no-install good2go --help | head -n 1 | grep -q '^good2go:'
          npx --no-install good2go init "$SMOKE/project"
          test -d "$SMOKE/project"
          cp "$TARBALL" "$GITHUB_WORKSPACE/release.tgz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: release.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later; Node 24 may bundle an older npm. Pinned to
      # a major, not `latest`, in the one job that holds `id-token: write`.
      # No registry-url here: setup-node would write a token placeholder into .npmrc.
      - run: npm install -g npm@11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
      # The tarball the verify job built and smoke-tested, not a second build.
      - run: npm publish ./release.tgz --provenance --access public
