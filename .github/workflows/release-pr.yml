name: release-pr

# Decides from CHANGELOG.md whether main holds user-facing changes that warrant a release and,
# if so, opens a "Release X.Y.Z" pull request that bumps package.json and moves the entries
# under "## Unreleased" to a dated heading. It never tags and never publishes: a person merges
# the pull request, pushes the tag and approves the `npm` environment, as docs/RELEASING.md
# describes. It holds no npm credential. The rule is scripts/release-plan.mts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - package.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Plan
        id: plan
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' || true)"
          if [ -n "$tag" ]; then
            node scripts/release-plan.mts plan --since "$tag" > plan.json
          else
            node scripts/release-plan.mts plan > plan.json
          fi
          cat plan.json
          # Only a plain release flag and a strict semver leave this step as outputs.
          node -e '
            const p = JSON.parse(require("node:fs").readFileSync("plan.json", "utf8"));
            if (p.release && !/^\d+\.\d+\.\d+$/.test(p.next)) { console.error("bad version"); process.exit(1); }
            const out = `release=${p.release}\nnext=${p.next ?? ""}\nbump=${p.bump ?? ""}\n`;
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, out);
            require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Release plan: " + p.reason + "\n");
          '
      - name: Open the release pull request
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.plan.outputs.next }}
          BUMP: ${{ steps.plan.outputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="release/v$NEXT"
          if git rev-parse -q --verify "refs/tags/v$NEXT" > /dev/null; then
            echo "v$NEXT is already tagged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          npm version "$NEXT" --no-git-tag-version
          node scripts/release-plan.mts apply "$NEXT" "$(date -u +%F)"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release $NEXT"
          # Rebuilt from main on every run, so it always reflects the current Unreleased section.
          git push --force origin "HEAD:refs/heads/$branch"
          # The repository may not let Actions open a pull request (Settings > Actions > General);
          # the branch is there either way.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base "$DEFAULT_BRANCH" \
              --title "Release $NEXT" \
              --body "A $BUMP release, planned from the entries under \"Unreleased\" in CHANGELOG.md by scripts/release-plan.mts. Review the version and the notes. After merging, tag the commit \`v$NEXT\` and approve the \`npm\` environment (docs/RELEASING.md). Nothing is published until you do." \
              || echo "Could not open a pull request; merge $branch by hand." >> "$GITHUB_STEP_SUMMARY"
          fi
